site_name: Arch Notes
site_url: https://clarchnotes.github.io

theme:
  name: material
  palette:
    primary: lime
  features:
    - content.action.edit # Edit button
    - content.action.view # View source code button
    - content.code.copy # Support code block copying
    - navigation.footer # Previous and next page
    - navigation.tabs # Top-level navigation in horizontal bar
    - content.code.annotate # Add clickable annotations in code blocks, see https://squidfunk.github.io/mkdocs-material/reference/code-blocks/#adding-annotations
    # - navigation.tracking # URL in address bar changes to section URL based on current position
    - navigation.indexes # Attach index pages directly to section names
    - navigation.top # Back to top button
    # - navigation.sections # Second-level navigation in bold
    # - navigation.expand # Navigation expanded by default
    - toc.follow # TOC follows current position
    # - toc.integrate # Integrate document TOC into main navigation
    - search.suggest
    - search.highlight
    - search.share
  language: "zh"

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

